name: Supabase keepalive

on:
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gravar o sinal de vida
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_PUBLISHABLE_KEY."; exit 1
          fi
          status=$(curl -s -m 30 --retry 3 --retry-delay 10 -o /tmp/sinal.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/rpc/sinal_de_vida" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}') || true
          echo "Sinal de vida HTTP $status: $(cat /tmp/sinal.txt 2>/dev/null)"
          if [ "$status" = "200" ]; then exit 0; fi
          echo "::error::Supabase respondeu HTTP $status. Confira os secrets e se o Script 3 foi rodado."
          exit 1
